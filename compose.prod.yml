services:
  frontend:
    container_name: dsa-finals-psu_frontend_prod
    build:
      context: ./frontend
      target: prod
    ports:
      - "${FRONTEND_PORT:-5373}:8080"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    container_name: dsa-finals-psu_backend_prod
    build:
      context: ./backend
      target: prod
    ports:
      - "${BACKEND_PORT:-4100}:4100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
