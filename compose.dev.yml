services:
  frontend:
    container_name: dsa-finals-psu_frontend_dev
    build:
      context: ./frontend
      target: dev
    ports:
      - "${FRONTEND_PORT:-5373}:5373"
    environment:
      DEVELOPMENT_BACKEND_URL: http://backend:4100
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    container_name: dsa-finals-psu_backend_dev
    build:
      context: ./backend
      target: dev
    ports:
      - "${BACKEND_PORT:-4100}:4100"
    volumes:
      - ./backend:/app
      - /app/node_modules

  postgres:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  psql:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: dsa-finals-psu_psql_dev
    profiles: ["tools"]
    env_file:
      - ./backend/.env
    entrypoint: ["sh", "-c", "psql \"$$DATABASE_URL\""]
    networks:
      - app
      - db
