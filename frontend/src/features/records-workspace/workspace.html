<section class="dsa-drive-shell" aria-label="DataSpace Workspace">
  <header class="dsa-topbar">
    <a class="dsa-brand" href="/" aria-label="DataSpace home">
      <span class="dsa-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="6" rx="7.5" ry="3" />
          <path d="M4.5 6v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3V6" />
          <path d="M4.5 12v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6" />
        </svg>
      </span>
      <span class="dsa-brand-title">Data<span>Space</span></span>
    </a>

    <div class="dsa-search-wrap">
      <label for="dsaSearchInput" class="sr-only">Search records</label>
      <input
        id="dsaSearchInput"
        class="dsa-search-input"
        type="search"
        placeholder="Search records by keyword, ID, or exact value..."
        autocomplete="off"
      />
      <button
        id="dsaFilterToggleBtn"
        class="dsa-filter-btn"
        type="button"
        aria-expanded="false"
        aria-controls="dsaFilterDrawer"
      >
        Filters
      </button>

      <div id="dsaFilterDrawer" class="dsa-filter-drawer" hidden>
        <div class="dsa-filter-grid">
          <label class="dsa-field">
            <span>Search Algorithm</span>
            <select id="dsaSearchMode">
              <option value="linear">Linear Search (Partial match, O(n))</option>
              <option value="binary">Binary Search (Exact match, O(log n))</option>
            </select>
          </label>

          <div id="dsaFilterFields" class="dsa-filter-fields"></div>

          <label class="dsa-field">
            <span>Sort Direction</span>
            <select id="dsaSortDir">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>
          </label>
        </div>
      </div>
    </div>

    <div class="dsa-topbar-actions">
      <button id="dsaSignOutBtn" class="dsa-filter-btn" type="button">Sign out</button>
    </div>
  </header>

  <div class="dsa-body">
    <aside class="dsa-sidebar" aria-label="Workspace Navigation">
      <button id="dsaNewRecordBtn" class="dsa-new-btn" type="button">
        <span class="dsa-plus" aria-hidden="true">+</span>
        <span>New</span>
      </button>
      <nav class="dsa-nav-list">
        <button class="dsa-nav-item" type="button" data-nav="archived" aria-pressed="false">Archived</button>
      </nav>

      <section class="dsa-file-panel" aria-labelledby="dsaFilePanelTitle">
        <h2 id="dsaFilePanelTitle" class="dsa-file-panel-title">Files</h2>
        <div id="dsaDatasetList" class="dsa-file-list"></div>
      </section>
    </aside>

    <main class="dsa-main">
      <div class="dsa-main-header">
        <div>
          <h1 id="dsaWorkspaceTitle" class="dsa-page-title">DataSpace</h1>
          <p id="dsaWorkspaceSubtitle" class="dsa-page-subtitle">
            Business Record Management
          </p>
        </div>

        <div class="dsa-view-toggle">
          <button id="dsaListViewBtn" class="dsa-view-btn" type="button" aria-pressed="false">
            List
          </button>
          <button id="dsaGridViewBtn" class="dsa-view-btn" type="button" aria-pressed="false">
            Grid
          </button>
          <button
            id="dsaTableViewBtn"
            class="dsa-view-btn is-active"
            type="button"
            aria-pressed="true"
          >
            Table
          </button>
        </div>
      </div>

      <div id="dsaStatusBar" class="dsa-status-bar" role="status" aria-live="polite">
        Ready.
      </div>

      <section class="dsa-section" aria-labelledby="dsaSuggestedHeading">
        <div class="dsa-section-header">
          <button
            id="dsaToggleSuggestedBtn"
            class="dsa-collapse-btn"
            type="button"
            aria-expanded="true"
          >
            <span id="dsaSuggestedHeading">Sorted highlights</span>
          </button>
          <span class="dsa-section-hint">Leading entries in sorted order</span>
        </div>
        <div id="dsaSuggestedRow" class="dsa-suggested-grid"></div>
      </section>

      <section id="dsaDashboard" class="dsa-section" aria-labelledby="dsaDashboardHeading">
        <div class="dsa-section-header">
          <h2 id="dsaDashboardHeading" class="dsa-section-title">Business snapshot</h2>
          <span class="dsa-section-hint">Totals for the current view</span>
        </div>

        <div class="dsa-kpi-strip">
          <article class="dsa-kpi-card">
            <span class="dsa-kpi-label">Records</span>
            <span id="dsaKpiRecords" class="dsa-kpi-value">0</span>
          </article>
          <article class="dsa-kpi-card">
            <span class="dsa-kpi-label">Archived</span>
            <span id="dsaKpiArchived" class="dsa-kpi-value">0</span>
          </article>
          <article class="dsa-kpi-card">
            <span class="dsa-kpi-label">Total amount</span>
            <span id="dsaKpiAmount" class="dsa-kpi-value">₱0.00</span>
          </article>
          <article class="dsa-kpi-card">
            <span class="dsa-kpi-label">Categories in use</span>
            <span id="dsaKpiCategories" class="dsa-kpi-value">0</span>
          </article>
        </div>

        <div class="dsa-chart-grid">
          <article class="dsa-chart-panel dsa-span-wide">
            <h3 id="dsaTimeTitle" class="dsa-panel-title">Records over time</h3>
            <div class="dsa-chart-canvas">
              <canvas id="dsaTimeChart" role="img" aria-label="Records over time"></canvas>
            </div>
            <p id="dsaTimeChartEmpty" class="dsa-panel-empty" hidden></p>
          </article>

          <article class="dsa-chart-panel">
            <h3 id="dsaGroupTitle" class="dsa-panel-title">Records by group</h3>
            <div class="dsa-chart-canvas">
              <canvas id="dsaGroupChart" role="img" aria-label="Records by group"></canvas>
            </div>
            <p id="dsaGroupChartEmpty" class="dsa-panel-empty" hidden></p>
          </article>

          <article class="dsa-chart-panel">
            <h3 id="dsaMeasureTitle" class="dsa-panel-title">Totals</h3>
            <div class="dsa-chart-canvas">
              <canvas id="dsaMeasureChart" role="img" aria-label="Totals by group"></canvas>
            </div>
            <p id="dsaMeasureChartEmpty" class="dsa-panel-empty" hidden></p>
          </article>
        </div>
      </section>

      <section class="dsa-section" aria-labelledby="dsaRecordsHeading">
        <div class="dsa-section-header">
          <button
            id="dsaToggleRecordsBtn"
            class="dsa-collapse-btn"
            type="button"
            aria-expanded="true"
          >
            <span id="dsaRecordsHeading">All records</span>
          </button>
          <span id="dsaRecordCountLabel" class="dsa-section-hint">0 records</span>
        </div>
        <div id="dsaRecordsContainer" class="dsa-records-grid"></div>
      </section>
    </main>
  </div>

  <dialog id="dsaRecordModal" class="dsa-modal" aria-labelledby="dsaModalTitle">
    <form id="dsaRecordForm" method="dialog" class="dsa-modal-card">
      <div class="dsa-modal-header">
        <h2 id="dsaModalTitle">Add Record</h2>
        <button id="dsaCloseModalBtn" class="dsa-icon-btn" type="button" aria-label="Close">
          ✕
        </button>
      </div>

      <input type="hidden" id="dsaRecordInternalId" />

      <div id="dsaRecordFields" class="dsa-form-grid"></div>

      <div class="dsa-csv-section" id="dsaCsvSection">
        <div class="dsa-csv-header">
          <span class="dsa-csv-title">Add a File (CSV Import)</span>
          <button type="button" class="dsa-btn dsa-btn-ghost dsa-btn-sm" id="dsaBrowseCsvBtn">
            Browse Files
          </button>
          <input
            type="file"
            id="dsaCsvFileInput"
            accept=".csv,text/csv"
            hidden
          />
        </div>

        <button
          type="button"
          id="dsaCsvDropzone"
          class="dsa-csv-dropzone"
          aria-label="Drag and drop a CSV file here or click to browse"
        >
          <span class="dsa-csv-drop-text">Drag &amp; drop a <strong>.csv</strong> file here, or use <strong>Browse Files</strong></span>
          <span class="dsa-csv-subtext" id="dsaCsvFileMeta">No CSV file selected yet.</span>
        </button>

        <div id="dsaCsvReviewBox" class="dsa-csv-review" hidden>
          <div class="dsa-csv-review-top">
            <span class="dsa-csv-detected-badge" id="dsaCsvDetectedInfo"></span>
          </div>

          <div id="dsaCsvMapping" class="dsa-csv-mapping"></div>

          <p id="dsaCsvReadyCount" class="dsa-csv-ready"></p>

          <p id="dsaCsvProblemsCount" class="dsa-csv-problems-count"></p>
          <ul id="dsaCsvProblems" class="dsa-csv-problems"></ul>

          <div class="dsa-csv-preview-wrap">
            <table class="dsa-csv-preview-table" id="dsaCsvPreviewTable"></table>
          </div>

          <div class="dsa-csv-review-actions">
            <button type="button" class="dsa-btn dsa-btn-ghost dsa-btn-sm" id="dsaClearCsvBtn">
              Clear File
            </button>
            <button type="button" class="dsa-btn dsa-btn-primary dsa-btn-sm" id="dsaImportCsvBtn">
              Import File
            </button>
          </div>
        </div>
      </div>

      <div class="dsa-modal-footer">
        <button id="dsaCancelModalBtn" class="dsa-btn dsa-btn-ghost" type="button">Cancel</button>
        <button class="dsa-btn dsa-btn-primary" type="submit">Save &amp; Sort</button>
      </div>
    </form>
  </dialog>
</section>
