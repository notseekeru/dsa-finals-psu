<main class="auth-page">
    <section class="auth-card">

        <a href="/" class="auth-back">← Back to home</a>

        <a href="/" class="auth-brand">Data<span>Space</span>.</a>

        <h1>Sign in</h1>

        <p class="auth-intro">
            Your records are where you left them.
        </p>

        <form class="auth-form">

            <div class="auth-field">

                <label for="email">Email</label>

                <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">

                <p class="auth-error" role="alert" id="email-error"></p>

            </div>

            <div class="auth-field">

                <label for="password">Password</label>

                <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required aria-describedby="password-error">

                <p class="auth-error" role="alert" id="password-error"></p>

            </div>

            <p class="auth-error" role="alert" id="form-error"></p>

            <button type="submit">Sign in</button>

        </form>

        <p class="auth-switch">
            New here? <a href="/signup">Create an account</a>
        </p>

    </section>
</main>
